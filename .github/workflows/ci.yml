name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build single-file bundle
        run: npm run build:single

      - name: Verify bundle is self-contained
        run: |
          if grep -qE 'from "\.\.?/' dist/pi-sysmon.ts; then
            echo "::error::dist bundle still contains local relative imports"
            exit 1
          fi
          echo "bundle is self-contained"
