name: Release

# Triggers on a version tag (`v0.11.0`, `v1.2.3`). A tag is the only thing that
# can reach the registry, which keeps "what is published" traceable to exactly
# one commit.
#
# Authentication is **trusted publishing** (OIDC), not a token: npm accepts this
# run because `zzjcool/pi-sysmon` + this filename are registered as the package's
# trusted publisher on npmjs.com, and the credential is the `id-token: write`
# permission below — minted per run, expiring with it. There is no NPM_TOKEN
# secret to leak or rotate. Consequences worth knowing:
#   · renaming this file **breaks publishing** until the trusted-publisher entry
#     on npmjs.com is updated to the new name;
#   · the publish job must stay *in this file* — npm matches `job_workflow_ref`,
#     which names the called workflow, not its caller, so moving the publish
#     steps into a reusable workflow makes the OIDC exchange fail;
#   · publish is irreversible the moment `npm publish` returns, so pushing the
#     tag is the go/no-go. The dry run below still catches a broken tarball or a
#     stale version number before anything is written.
on:
  push:
    tags:
      - "v*.*.*"

env:
  # Trusted publishing needs npm >= 11.5.1; the npm bundled with this Node is
  # 10.x. Pinned, never floating: an npm regression must not decide what
  # publishes a version number that can never be reused. Run through `npx`, not
  # `npm i -g npm@12`: the global install **uninstalls the npm it is running
  # on** and dies relinking (`MODULE_NOT_FOUND: Cannot find module
  # 'promise-retry'`). `--version` prints what is actually running, so the log
  # records it.
  NPM_VERSION: "12.2.1"

# Never let two tags race for the same npm version, and never cancel a publish
# halfway through — the rerun would find the version already taken.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # checkout
  id-token: write # the only credential: the OIDC token npm exchanges for publish rights

jobs:
  # Reuse the PR gate instead of restating it. A tag must be exactly as green as
  # a merge candidate; duplicating the steps here is how the two drift.
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          # Deliberately **no** `registry-url`: setup-node would write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
          # i.e. a token path where the OIDC exchange should be. The default
          # registry is already registry.npmjs.org, so nothing is needed.

      - name: Resolve npm (trusted publishing needs >= 11.5.1)
        run: |
          set -eu
          NPM="npm@${NPM_VERSION}"
          echo "NPM=${NPM}" >> "$GITHUB_ENV"
          npx --yes "$NPM" --version

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Assert the tag matches package.json
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != pkg ${pkg_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches pkg ${pkg_version}"

      # A token in the environment silently wins over the OIDC exchange — npm
      # then publishes with it and generates no provenance instead of failing.
      # Refuse rather than ship a release that only *looks* trusted.
      - name: Assert no registry token shadows OIDC
        run: |
          set -eu
          for v in NODE_AUTH_TOKEN NPM_TOKEN NODE_TOKEN; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set; trusted publishing requires no token"
              exit 1
            fi
          done

      # `--ignore-scripts` is deliberate. `prepublishOnly` calls `npm run check`,
      # and this job runs after the reusable `check` job already gated the same
      # commit — so without it the suite would run **twice**. Skipping here does
      # not weaken the guarantee: the gate that matters is the `check` job, and
      # if it fails this job never starts. A manual `npm publish` from a laptop
      # still gets the guard, because that invocation does not pass this flag.
      - name: Verify the tarball (dry run)
        run: npx --yes "$NPM" publish --dry-run --access public --ignore-scripts

      # `--provenance` ties the tarball to this workflow run and commit; the
      # attestation is minted from the same OIDC identity that authorized the
      # publish, so it needs no extra secret.
      - name: Publish
        run: |
          npx --yes "$NPM" publish --access public \
            --provenance --ignore-scripts

      - name: Summary
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Published: pi-sysmon ${version}"
            echo
            echo "https://www.npmjs.com/package/pi-sysmon/v/${version}"
            echo
            echo "Tagged commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
